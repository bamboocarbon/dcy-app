<title>Digital Credit Yield</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    :root {
      --bg: #060809;
      --card-bg: #161b27;
      --card-border: rgba(255,255,255,0.08);
      --orange: #f5a623;
      --white: #ffffff;
      --muted: #6b7280;
      --grey-text: #9ca3af;
      --input-bg: #1e2535;
      --input-border: rgba(255,255,255,0.1);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top,24px) 24px env(safe-area-inset-bottom,24px);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      width: 100%;
      max-width: 480px;
      padding: 28px 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 0;
      cursor: default;
      user-select: none;
      transition: border-color 0.2s ease;
    }

    .card.editing { border-color: rgba(245,166,35,0.35); }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .header-dot {
      width: 13px;
      height: 13px;
      background: var(--orange);
      border-radius: 3px;
      flex-shrink: 0;
    }

    .header-text {
      color: var(--white);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Display blocks wrapper — collapses when editing */
    .display-blocks {
      overflow: hidden;
      max-height: 600px;
      opacity: 1;
      transition: max-height 0.35s ease, opacity 0.25s ease;
    }

    .card.editing .display-blocks {
      max-height: 0;
      opacity: 0;
    }

    /* Block 1: orange — email "Question" label style (18px / 700) */
    .block-1 {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      color: var(--grey-text);
      padding: 0 0 20px;
      word-break: break-word;
    }

    /* Block 2: bold white — email h1 style (24px / 700) */
    .block-2 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
      color: var(--white);
      padding: 0 0 18px;
      word-break: break-word;
    }

    /* Block 3: grey — email teaser style (15px / 400 / #9ca3af) */
    .block-3 {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.75;
      text-align: center;
      color: var(--grey-text);
      padding: 0 0 20px;
      word-break: break-word;
    }

    .display-block.hidden { display: none; }

    /* Hint */
    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.45;
      margin-bottom: 20px;
      transition: opacity 0.4s ease;
    }

    .hint.hidden { opacity: 0; pointer-events: none; }
    .card.editing .hint { display: none; }

    /* Footer */
    .card-footer {
      text-align: center;
      color: var(--white);
      font-size: 13px;
      letter-spacing: 0.02em;
      opacity: 0.55;
    }

    /* Edit panel */
    .edit-section {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.4s ease, opacity 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .edit-section.open {
      max-height: 420px;
      opacity: 1;
      margin-bottom: 16px;
    }

    .edit-section-inner {
      padding-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      resize: none;
      outline: none;
      min-height: 64px;
      transition: border-color 0.2s ease;
      -webkit-appearance: none;
    }

    textarea:focus { border-color: var(--orange); }
    textarea::placeholder { color: var(--muted); }

    /* Input 1: matches block-1 */
    #input-1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--grey-text);
      text-align: center;
    }

    #input-1::placeholder { color: #4b5563; }

    /* Input 2: matches block-2 */
    #input-2 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
    }

    /* Input 3: matches block-3 */
    #input-3 {
      font-size: 15px;
      color: var(--grey-text);
      line-height: 1.75;
    }

    #input-3::placeholder { color: #4b5563; }

    .btn-row { display: flex; gap: 10px; }

    .btn {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
      -webkit-appearance: none;
    }

    .btn:active { opacity: 0.8; transform: scale(0.97); }
    .btn-primary { background: var(--orange); color: #0d1117; }
    .btn-secondary { background: var(--input-bg); color: var(--muted); border: 1px solid var(--input-border); }

    .toast {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--orange);
      color: #0d1117;
      padding: 10px 22px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .banner {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: normal;
      color: var(--orange);
      background: none;
      border: 1px solid var(--orange);
      border-radius: 12px;
      padding: 10px 20px;
      margin-bottom: 20px;
      font-family: Arial, Helvetica, sans-serif;
      display: block;
    }
  </style>
</head>
<body>

<div class="card" id="card">

  <div class="header">
    <div class="header-dot"></div>
    <div class="header-text">Digital Credit Yield · <span id="date-display"></span></div>
  </div>

  <div class="banner">Tracking STRC and SATA for growth</div>

  <div class="display-blocks" id="display-blocks">
    <div class="block-1 display-block" id="block-1">Thought for the Day</div>
    <div class="block-2 display-block" id="block-2">Another month, another dividend. Repeat.</div>
    <div class="block-3 display-block hidden" id="block-3"></div>
  </div>

  <img id="daily-chart" src="" alt="Daily chart" style="display:none;width:100%;border-radius:10px;margin-top:16px;">

  <div class="hint" id="hint">double-tap to edit</div>

  <div class="edit-section" id="edit-section">
    <div class="edit-section-inner">
      <textarea id="input-1" placeholder="Thought for the Day…" rows="2"></textarea>
      <textarea id="input-2" placeholder="Main thought…" rows="2"></textarea>
      <textarea id="input-3" placeholder="Detail line…" rows="2"></textarea>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="cancelEdit()">Cancel</button>
        <button class="btn btn-primary" onclick="applyThought()">Save</button>
      </div>
    </div>
  </div>

  <div class="card-footer">digitalcredityield.com</div>

</div>

<div class="toast" id="toast">Saved ✓</div>

<button id="dev-edit-btn" onclick="toggleDevEdit()" style="
  position:fixed; top:16px; right:16px;
  background:rgba(245,166,35,0.15); color:#f5a623;
  border:1px solid rgba(245,166,35,0.4); border-radius:8px;
  padding:6px 14px; font-size:12px; font-weight:700;
  cursor:pointer; letter-spacing:0.05em;
  font-family:Arial,Helvetica,sans-serif;
">EDIT</button>


<script>
  const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const now = new Date();
  document.getElementById('date-display').textContent =
    days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();

  // Backwards compat: migrate old dcy_thought → dcy_thought_2 (the bold white line)
  const legacy = localStorage.getItem('dcy_thought');
  if (legacy && !localStorage.getItem('dcy_thought_2')) {
    localStorage.setItem('dcy_thought_2', legacy);
  }

  const DEFAULTS = {
    1: 'Thought for the Day',
    2: 'Another month, another dividend. Repeat.',
    3: '',
  };

  function renderBlocks() {
    [1, 2, 3].forEach(i => {
      const block = document.getElementById('block-' + i);
      const val   = localStorage.getItem('dcy_thought_' + i);
      const text  = val !== null ? val : DEFAULTS[i];
      if (text) {
        block.textContent = text;
        block.classList.remove('hidden');
      } else {
        block.classList.add('hidden');
      }
    });
  }

  renderBlocks();

  async function fetchDailyCard() {
    try {
      const res = await fetch('https://digitalcredityield.com/api/dcy-card');
      if (!res.ok) return;
      const card = await res.json();
      if (!card.updatedAt) return;

      const stored = localStorage.getItem('dcy_card_timestamp');
      if (stored && card.updatedAt <= stored) return;

      localStorage.setItem('dcy_thought_1', card.box1 || 'Snapshot');
      localStorage.setItem('dcy_thought_2', card.box2 || '');
      localStorage.setItem('dcy_thought_3', card.box3 || '');
      localStorage.setItem('dcy_card_timestamp', card.updatedAt);
      renderBlocks();

      const chartImg = document.getElementById('daily-chart');
      if (card.hasChart && chartImg) {
        chartImg.src = 'https://digitalcredityield.com/api/dcy-chart?' + Date.now();
        chartImg.style.display = 'block';
      }
    } catch (e) { /* silent fail — works offline */ }
  }

  fetchDailyCard();

  setTimeout(() => {
    if (!document.getElementById('edit-section').classList.contains('open'))
      document.getElementById('hint').classList.add('hidden');
  }, 4000);

  let lastTap = 0;
  document.getElementById('card').addEventListener('touchend', function() {
    if (document.getElementById('edit-section').classList.contains('open')) return;
    const t = Date.now();
    if (t - lastTap < 300 && t - lastTap > 0) openEdit();
    lastTap = t;
  });

  function openEdit() {
    [1, 2, 3].forEach(i => {
      const val = localStorage.getItem('dcy_thought_' + i);
      document.getElementById('input-' + i).value = val !== null ? val : DEFAULTS[i];
    });
    document.getElementById('edit-section').classList.add('open');
    document.getElementById('card').classList.add('editing');
    document.getElementById('hint').classList.add('hidden');
  }

  function cancelEdit() {
    document.getElementById('edit-section').classList.remove('open');
    document.getElementById('card').classList.remove('editing');
    document.activeElement.blur();
  }

  function applyThought() {
    [1, 2, 3].forEach(i => {
      const val = document.getElementById('input-' + i).value.trim();
      if (val) {
        localStorage.setItem('dcy_thought_' + i, val);
      } else {
        localStorage.removeItem('dcy_thought_' + i);
      }
    });
    document.getElementById('edit-section').classList.remove('open');
    document.getElementById('card').classList.remove('editing');
    document.activeElement.blur();
    setTimeout(renderBlocks, 200);
    showToast('Saved ✓');
  }

  function toggleDevEdit() {
    const btn = document.getElementById('dev-edit-btn');
    if (document.getElementById('edit-section').classList.contains('open')) {
      cancelEdit();
      btn.textContent = 'EDIT';
    } else {
      openEdit();
      btn.textContent = 'CLOSE';
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
